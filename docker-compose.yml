version: "3.8"

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: edge_memory_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_NAME=E-MEMBRO
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - SQLITE_DB_PATH=/app/data/edge_memory.db
      - EDGE_QDRANT_PATH=/app/data/qdrant_edge
    volumes:
      - edge_data:/app/data
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: edge_memory_dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  edge_data:
