version: "3.8"

services:
  qdrant-server:
    image: qdrant/qdrant:v1.11.0
    container_name: edge_memory_qdrant_cloud
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: edge_memory_api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Edge Memory Platform
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - CLOUD_QDRANT_URL=http://qdrant-server:6333
      - USE_LOCAL_CLOUD_QDRANT=false
      - SQLITE_DB_PATH=/app/data/edge_memory.db
      - EDGE_QDRANT_PATH=/app/data/qdrant_edge
    volumes:
      - edge_data:/app/data
    depends_on:
      qdrant-server:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: Dockerfile
    container_name: edge_memory_dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_storage:
  edge_data:
